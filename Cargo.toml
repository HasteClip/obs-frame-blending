[package]
name = "obs-frame-blending"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Frame blending for OBS Studio, from HasteClip"
repository = "https://github.com/HasteClip/obs-frame-blending"
publish = false

[lib]
# OBS loads plugins by their file name: hasteclip_frame_blending.dll.
name = "hasteclip_frame_blending"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"

# The capture and blending is HasteClip's own (its `capture` crate), from
# its feat/obs-plugin branch till that's merged. To build against a
# HasteClip checkout of your own instead, see the README.
[target.'cfg(target_os = "windows")'.dependencies]
capture = { git = "https://github.com/HasteClip/hasteclip", branch = "feat/obs-plugin" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# As in HasteClip: dependencies and the capture crate optimized even in
# debug builds, so blending keeps up while the plugin is worked on.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.capture]
opt-level = 3
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
